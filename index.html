<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShimmyCane</title>
    <style>
        :root {
            --bg: #fff8f1;
            --surface: #ffffff;
            --text: #1f1d3a;
            --muted: #6c6891;
            --border: #ece6f7;
            --shadow: 0 2px 4px rgba(60, 40, 120, 0.06), 0 10px 24px rgba(60, 40, 120, 0.08);

            --coral: #ff6b6b;
            --sun: #ffb02e;
            --mint: #2ec4a0;
            --sky: #3d8bff;
            --grape: #8b5cf6;
            --pink: #ff4fa3;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #14122a;
                --surface: #1e1b3a;
                --text: #f4f1ff;
                --muted: #a9a3d1;
                --border: #2f2a55;
                --shadow: 0 2px 4px rgba(0, 0, 0, 0.35), 0 10px 24px rgba(0, 0, 0, 0.3);
            }
        }

        :root[data-theme="dark"] {
            --bg: #14122a;
            --surface: #1e1b3a;
            --text: #f4f1ff;
            --muted: #a9a3d1;
            --border: #2f2a55;
            --shadow: 0 2px 4px rgba(0, 0, 0, 0.35), 0 10px 24px rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 10% 10%, rgba(255, 107, 107, 0.18), transparent 40%),
                radial-gradient(circle at 90% 20%, rgba(61, 139, 255, 0.16), transparent 42%),
                radial-gradient(circle at 50% 100%, rgba(46, 196, 160, 0.16), transparent 45%),
                var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* Decorative geometry floating behind the content */
        .shape {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0.55;
        }

        .shape.circle { border-radius: 50%; }
        .shape.square { border-radius: 14px; transform: rotate(18deg); }
        .shape.triangle { clip-path: polygon(50% 0, 100% 100%, 0 100%); }
        .shape.ring { border-radius: 50%; background: none !important; border: 14px solid; }
        .shape.blob { border-radius: 60% 40% 55% 45% / 50% 60% 40% 50%; }

        .s1 { width: 120px; height: 120px; background: var(--sun); top: 6%; left: 4%; }
        .s2 { width: 70px; height: 70px; background: var(--pink); top: 18%; right: 8%; }
        .s3 { width: 90px; height: 90px; background: var(--mint); top: 46%; left: -28px; }
        .s4 { width: 110px; height: 110px; background: var(--sky); bottom: 10%; right: 4%; }
        .s5 { width: 80px; height: 80px; background: var(--grape); bottom: -20px; left: 12%; }
        .s6 { width: 60px; height: 60px; background: var(--coral); top: 60%; right: 14%; }
        .s7 { width: 100px; height: 100px; color: var(--sun); top: 30%; left: 46%; }
        .s8 { width: 90px; height: 90px; background: var(--mint); top: 2%; left: 42%; }

        .wrap {
            position: relative;
            z-index: 1;
            max-width: 960px;
            margin: 0 auto;
            padding: 56px 16px 72px;
        }

        header {
            text-align: center;
            margin-bottom: 48px;
        }

        h1 {
            display: inline-block;
            margin: 0;
            font-size: clamp(2.4rem, 7vw, 3.8rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(100deg, var(--coral), var(--sun) 35%, var(--mint) 65%, var(--sky));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        header p {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 1.05rem;
        }

        section + section { margin-top: 44px; }

        h2 {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 0 16px;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
        }

        h2 .badge {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            transform: rotate(45deg);
            background: var(--accent);
        }

        h2::after {
            content: "";
            flex: 1;
            height: 3px;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--accent), transparent);
            opacity: 0.5;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .grid a {
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            height: 100%;
            padding: 16px 18px;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            color: var(--text);
            text-decoration: none;
            font-weight: 700;
            overflow: hidden;
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }

        /* Colored geometric tile for each card */
        .grid a::before {
            content: "";
            flex: 0 0 38px;
            height: 38px;
            border-radius: 12px;
            background: var(--accent);
            box-shadow: 0 6px 14px -4px var(--accent);
            transition: transform 0.25s ease;
        }

        .grid a.tri::before { border-radius: 4px; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
        .grid a.circ::before { border-radius: 50%; }
        .grid a.dia::before { border-radius: 6px; transform: rotate(45deg) scale(0.8); }

        /* Corner accent that peeks in on hover */
        .grid a::after {
            content: "";
            position: absolute;
            top: -18px;
            right: -18px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0.12;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        .grid a:hover,
        .grid a:focus-visible {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 14px 28px -10px var(--accent);
            outline: none;
        }

        .grid a:hover::before,
        .grid a:focus-visible::before { transform: rotate(-8deg) scale(1.08); }

        .grid a:hover::after,
        .grid a:focus-visible::after { transform: scale(2.2); opacity: 0.18; }

        /* Each section gets its own color family */
        .games    { --accent: var(--coral); }
        .learning { --accent: var(--sky); }
        .family   { --accent: var(--mint); }

        footer {
            margin-top: 60px;
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
        }

        @media (max-width: 480px) {
            .wrap { padding-top: 40px; }
            .grid { grid-template-columns: 1fr 1fr; gap: 12px; }
            .grid a { padding: 14px; gap: 10px; font-size: 0.95rem; }
            .grid a::before { flex-basis: 30px; height: 30px; }
            .s7, .s8 { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="shape circle s1" aria-hidden="true"></div>
    <div class="shape square s2" aria-hidden="true"></div>
    <div class="shape circle s3" aria-hidden="true"></div>
    <div class="shape triangle s4" aria-hidden="true"></div>
    <div class="shape square s5" aria-hidden="true"></div>
    <div class="shape circle s6" aria-hidden="true"></div>
    <div class="shape ring s7" aria-hidden="true"></div>
    <div class="shape triangle s8" aria-hidden="true"></div>

    <main class="wrap">
        <header>
            <h1>ShimmyCane</h1>
            <p>Projects, games and tools in one place</p>
        </header>

        <section class="games">
            <h2><span class="badge"></span>Games</h2>
            <ul class="grid">
                <li><a class="tri" href="https://shimmycane.github.io/Snake-Cube/">Snake Cube</a></li>
                <li><a class="circ" href="https://shimmycane.github.io/Felix-Checkers/">Felix Checkers</a></li>
                <li><a class="dia" href="https://shimmycane.github.io/Moment/">Moment</a></li>
            </ul>
        </section>

        <section class="learning">
            <h2><span class="badge"></span>Learning</h2>
            <ul class="grid">
                <li><a class="tri" href="https://shimmycane.github.io/Test-Bank/">Test Bank</a></li>
                <li><a class="circ" href="https://shimmycane.github.io/Multiply/">Multiply</a></li>
                <li><a class="dia" href="https://shimmycane.github.io/Primes/">Primes</a></li>
                <li><a class="tri" href="https://shimmycane.github.io/Exponents/">Exponents</a></li>
                <li><a class="circ" href="https://shimmycane.github.io/Coins/">Coins</a></li>
                <li><a class="dia" href="https://shimmycane.github.io/Row-Boat/">Row Boat</a></li>
            </ul>
        </section>

        <section class="family">
            <h2><span class="badge"></span>Family</h2>
            <ul class="grid">
                <li><a class="tri" href="https://shimmycane.github.io/Family-Habits/">Family Habits</a></li>
                <li><a class="circ" href="https://shimmycane.github.io/Allowances/">Allowances</a></li>
                <li><a class="dia" href="https://shimmycane.github.io/How-Far-Is-It/">How Far Is It?</a></li>
            </ul>
        </section>

        <footer>
            &copy; ShimmyCane
        </footer>
    </main>
</body>
</html>
