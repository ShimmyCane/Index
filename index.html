<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShimmyCane</title>
    <style>
        :root {
            --bg: #f6f7fb;
            --surface: #ffffff;
            --text: #1d2233;
            --muted: #6b7288;
            --border: #e3e6ef;
            --accent: #3b6cf6;
            --accent-soft: #e8efff;
            --shadow: 0 1px 2px rgba(20, 25, 45, 0.06), 0 4px 14px rgba(20, 25, 45, 0.05);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0f1220;
                --surface: #171b2c;
                --text: #e7e9f3;
                --muted: #9aa1b8;
                --border: #262c42;
                --accent: #7f9cff;
                --accent-soft: #1f2741;
                --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.25);
            }
        }

        :root[data-theme="dark"] {
            --bg: #0f1220;
            --surface: #171b2c;
            --text: #e7e9f3;
            --muted: #9aa1b8;
            --border: #262c42;
            --accent: #7f9cff;
            --accent-soft: #1f2741;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.25);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.5;
        }

        .wrap {
            max-width: 960px;
            margin: 0 auto;
            padding: 56px 16px 72px;
        }

        header {
            text-align: center;
            margin-bottom: 48px;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.2rem, 6vw, 3.2rem);
            letter-spacing: -0.02em;
        }

        header p {
            margin: 8px 0 0;
            color: var(--muted);
        }

        section + section { margin-top: 40px; }

        h2 {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 14px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        h2::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 14px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .grid a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            height: 100%;
            padding: 16px 18px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }

        .grid a::after {
            content: "→";
            color: var(--muted);
            transition: transform 0.15s ease, color 0.15s ease;
        }

        .grid a:hover,
        .grid a:focus-visible {
            transform: translateY(-2px);
            border-color: var(--accent);
            color: var(--accent);
            outline: none;
        }

        .grid a:hover::after,
        .grid a:focus-visible::after {
            color: var(--accent);
            transform: translateX(3px);
        }

        footer {
            margin-top: 56px;
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
        }

        @media (max-width: 480px) {
            .wrap { padding-top: 40px; }
            .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .grid a { padding: 14px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <main class="wrap">
        <header>
            <h1>ShimmyCane</h1>
            <p>Projects, games and tools in one place</p>
        </header>

        <section>
            <h2>Games</h2>
            <ul class="grid">
                <li><a href="https://shimmycane.github.io/Snake-Cube/">Snake Cube</a></li>
                <li><a href="https://shimmycane.github.io/Felix-Checkers/">Felix Checkers</a></li>
                <li><a href="https://shimmycane.github.io/Moment/">Moment</a></li>
            </ul>
        </section>

        <section>
            <h2>Learning</h2>
            <ul class="grid">
                <li><a href="https://shimmycane.github.io/Test-Bank/">Test Bank</a></li>
                <li><a href="https://shimmycane.github.io/Multiply/">Multiply</a></li>
                <li><a href="https://shimmycane.github.io/Primes/">Primes</a></li>
                <li><a href="https://shimmycane.github.io/Exponents/">Exponents</a></li>
                <li><a href="https://shimmycane.github.io/Coins/">Coins</a></li>
                <li><a href="https://shimmycane.github.io/Row-Boat/">Row Boat</a></li>
            </ul>
        </section>

        <section>
            <h2>Family</h2>
            <ul class="grid">
                <li><a href="https://shimmycane.github.io/Family-Habits/">Family Habits</a></li>
                <li><a href="https://shimmycane.github.io/Allowances/">Allowances</a></li>
                <li><a href="https://shimmycane.github.io/How-Far-Is-It/">How Far Is It?</a></li>
            </ul>
        </section>

        <footer>
            &copy; ShimmyCane
        </footer>
    </main>
</body>
</html>
