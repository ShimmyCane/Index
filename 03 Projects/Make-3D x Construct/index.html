<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Make 3D x Construct · Home</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Make 3D x Construct</h1>
    <p>Home: projects, your library, the cloud library, sign-in.</p>
  </div>
  <div class="pills">
    <span id="pill-cloud" class="pill">cloud: checking…</span>
  </div>
</header>

<main class="home">
  <section class="panel" data-panel="projects" data-open="true">
    <button class="panelHead" type="button" aria-expanded="true" aria-controls="projects-body">
      <span class="panelIcon">🏛️</span><span class="panelTitle">Projects</span><span class="panelMark">▾</span>
    </button>
    <div class="panelBody" id="projects-body">
      <div class="cards" id="project-cards"></div>
    </div>
  </section>

  <section class="panel" data-panel="library" data-open="true">
    <button class="panelHead" type="button" aria-expanded="true" aria-controls="library-body">
      <span class="panelIcon">🗂️</span><span class="panelTitle">Library on this device</span><span class="panelMark">▾</span>
    </button>
    <div class="panelBody" id="library-body">
      <p class="help">Scenes you saved from the studio. They stay on this device.</p>
      <ul id="library-list" class="list"></ul>
    </div>
  </section>

  <section class="panel" data-panel="cloud" data-open="true">
    <button class="panelHead" type="button" aria-expanded="true" aria-controls="cloud-body">
      <span class="panelIcon">☁️</span><span class="panelTitle">Cloud library and sign-in</span><span class="panelMark">▾</span>
    </button>
    <div class="panelBody" id="cloud-body">
      <p id="cloud-status" class="msg" role="status"></p>
      <form id="send-form" class="stack">
        <label>Email (an existing account only)
          <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
        </label>
        <button type="submit" class="btn">Send a sign-in code</button>
      </form>
      <form id="verify-form" class="stack" hidden>
        <label>Code from the email
          <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code">
        </label>
        <button type="submit" class="btn">Sign in</button>
      </form>
      <button type="button" id="signout" class="btn ghost" hidden>Sign out</button>
      <h3 id="cloud-list-title" hidden>Saved in the cloud</h3>
      <ul id="cloud-list" class="list"></ul>
    </div>
  </section>
</main>

<script src="vendor/supabase/supabase.js"></script>
<script src="js/cloud/cloud.js"></script>
<script src="js/library/library.js"></script>
<script src="js/ui/home.js"></script>
</body>
</html>
