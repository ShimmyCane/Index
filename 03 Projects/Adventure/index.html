<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Patrick+Hand&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="play.css">
</head>
<body>
  <header class="top">
    <h1>📖 Adventure</h1>
    <span id="pill" class="pill">Waking up…</span>
  </header>

  <main class="play">
    <!-- Left: the story -->
    <section class="col story-col">
      <div id="sleep" class="sleep card hidden"></div>
      <article class="card story">
        <div class="story-head">
          <div>
            <div id="since" class="muted"></div>
            <h2 id="chTitle">…</h2>
          </div>
          <button class="btn sun read" id="readBtn" aria-label="Read aloud">🔊 Read</button>
        </div>
        <div class="chips" id="lengths">
          <button class="chip" data-len="tiny">A peek</button>
          <button class="chip" data-len="short">A minute</button>
          <button class="chip" data-len="long">The whole page</button>
        </div>
        <div id="recap" class="recap"></div>
        <div id="chText" class="story-text"></div>
        <p id="chPrompt" class="prompt"></p>
      </article>
    </section>

    <!-- Right: characters and the scene being built -->
    <section class="col scene-col">
      <div class="cast">
        <h3 class="label">Who's talking?</h3>
        <div id="roles" class="roles"></div>
      </div>

      <div id="speak" class="card speak hidden">
        <div class="speak-head">
          <span id="spEmoji" class="face"></span>
          <h3 id="spName"></h3>
          <button class="btn small" id="spDone">Done ✓</button>
        </div>
        <p id="spWhisper" class="whisper hidden"></p>
        <button class="btn coral mic" id="micBtn">🎤 Tap and talk</button>
        <p id="heard" class="heard"></p>
        <div class="type-row">
          <textarea class="field" id="typed" placeholder="Or type here (tap 🎤 on the keyboard to talk)"></textarea>
          <button class="btn mint" id="addBtn">Add ➕</button>
        </div>
        <p class="muted">Everything you add stays. No takebacks!</p>
      </div>

      <h3 class="label">The scene so far</h3>
      <ol id="beats" class="beats"></ol>
      <button class="btn sun send" id="sendBtn" disabled>📮 Send the scene</button>
      <p id="sendMsg" class="muted"></p>
    </section>
  </main>

  <div id="gear-extra">
    <label>Reading speed <input type="range" id="rate" min="0.6" max="1.3" step="0.05"></label>
    <label>Voice <select id="voice" class="field"></select></label>
    <label>Story size
      <button class="btn small" id="smaller">A−</button>
      <button class="btn small" id="bigger">A+</button>
    </label>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/play.js"></script>
</body>
</html>
