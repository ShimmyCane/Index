<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What to Cook — Recipe book</title>
<link rel="stylesheet" href="style.css">
<style>
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .chip { min-height: 44px; padding: 6px 12px; font-size: 15px; }
  .chip.on { background: var(--mint); }
  .book { display: grid; gap: 14px; margin-top: 10px; }
  @media (min-width: 620px) { .book { grid-template-columns: 1fr 1fr; } }
  .flip { perspective: 1200px; min-height: 210px; }
  .flip-inner { position: relative; width: 100%; min-height: 210px; transition: transform .5s; transform-style: preserve-3d; }
  .flip.open .flip-inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
          border: 3px solid var(--ink); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; overflow: hidden; }
  .front { background: var(--surface); color: var(--surface-ink); cursor: pointer; }
  .back { transform: rotateY(180deg); background: var(--paper); color: var(--ink); overflow-y: auto; }
  .flip:not(.open) .back { visibility: hidden; }
  .flip.open .front { visibility: hidden; }
  .tag { display: inline-block; font-size: 13px; padding: 2px 9px; border: 2px solid var(--ink); border-radius: 999px; background: var(--sun); color: var(--surface-ink); }
  .name { font: 700 20px Quicksand, system-ui, sans-serif; margin: 10px 0 6px; overflow-wrap: anywhere; }
  .desc { font-size: 15px; margin: 0 0 10px; }
  .meta { font-size: 13px; opacity: .85; }
  .have { font-size: 13px; }
  .ing { list-style: none; padding: 0; margin: 8px 0; font-size: 15px; }
  .ing li { padding: 3px 0; }
  .ing li.yes::before { content: "✅ "; }
  .ing li.no::before { content: "◻️ "; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .btns button, .btns a { min-height: 44px; font-size: 15px; padding: 6px 12px; }
  .btns a { display: inline-flex; align-items: center; color: var(--ink); text-decoration: none; background: #fff; border: 3px solid var(--ink); border-radius: var(--r); box-shadow: var(--shadow); font-weight: 700; }
  .mark { position: absolute; top: 10px; right: 12px; font-size: 20px; }
  .steps { margin: 6px 0 4px 18px; padding: 0; font-size: 14px; }
  .steps li { padding: 2px 0; }
</style>
</head>
<body>
<header class="top">
  <h1>📖 Recipe book</h1>
  <span id="statusPill" class="pill">this device</span>
</header>

<main>
  <p class="hint">Tap a card to turn it over. Pantry matches come from this device's pantry.</p>

  <div class="chips" role="group" aria-label="Filter">
    <button class="chip on" data-filter="all" type="button">All <span id="cAll"></span></button>
    <button class="chip" data-filter="fav" type="button">⭐ Favourites <span id="cFav"></span></button>
    <button class="chip" data-filter="have" type="button">🧺 We have most <span id="cHave"></span></button>
    <button class="chip" data-filter="soon" type="button">⏰ Use soon <span id="cSoon"></span></button>
    <button class="chip" data-filter="started" type="button">▶ Started <span id="cStart"></span></button>
  </div>

  <p id="saveState" class="hint" role="status"></p>
  <div id="book" class="book"></div>
  <div id="empty" class="empty" hidden>Nothing here yet.</div>
  <p class="hint"><a href="index.html">← Back to the pantry</a></p>
</main>

<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/db.js"></script>
<script>
(function () {
  'use strict';
  var KEY_FAV = 'wtc.recipeFav', KEY_START = 'wtc.recipeStart', KEY_ITEMS = 'wtc.items';
  var PALETTE = ['#fff3c4', '#cfe8c9', '#ffd9c7', '#bfeee0', '#e3d9ff', '#ffe1dc'];
  var recipes = [], items = [], fav = [], started = [], filter = 'all';
  var $ = function (id) { return document.getElementById(id); };

  function readList(key) { var v = WTCStore.read(key, []); return Array.isArray(v) ? v : []; }
  function writeList(key, v) { WTCStore.write(key, v); }

  function inStock() { return items.filter(function (it) { return it.status === 'in_stock'; }); }
  function isSoon(it) {
    if (it.freshness === 'use soon' || it.freshness === 'use now' || it.freshness === 'past') return true;
    if (!it.expires_on) return false;
    var days = Math.round((new Date(it.expires_on + 'T00:00:00') - new Date(new Date().toDateString())) / 86400000);
    return days <= 3;
  }
  function haveOf(ing) {
    var k = String(ing.match || '').toLowerCase();
    return inStock().filter(function (it) { return String(it.name || '').toLowerCase().indexOf(k) !== -1; });
  }
  function summary(r) {
    var n = r.ingredients.length, matched = 0, soon = false;
    r.ingredients.forEach(function (ing) {
      var hits = haveOf(ing);
      if (hits.length) matched++;
      if (hits.some(isSoon)) soon = true;
      ing.have = hits.length > 0;
    });
    return { matched: matched, n: n, most: matched * 2 >= n, soon: soon };
  }

  function googleUrl(name) { return 'https://www.google.com/search?q=' + encodeURIComponent(name + ' recipe versions'); }

  function card(r, i, s) {
    var isFav = fav.indexOf(r.id) !== -1, isStart = started.indexOf(r.id) !== -1;
    var flip = document.createElement('div'); flip.className = 'flip'; flip.dataset.id = r.id;
    var inner = document.createElement('div'); inner.className = 'flip-inner';

    var front = document.createElement('div'); front.className = 'face front';
    front.style.background = PALETTE[i % PALETTE.length];
    var tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = r.cuisine; front.appendChild(tag);
    if (isFav || isStart) { var m = document.createElement('span'); m.className = 'mark'; m.textContent = (isFav ? '⭐' : '') + (isStart ? '▶' : ''); front.appendChild(m); }
    var nm = document.createElement('div'); nm.className = 'name'; nm.textContent = r.name; front.appendChild(nm);
    var ds = document.createElement('p'); ds.className = 'desc'; ds.textContent = r.description; front.appendChild(ds);
    var mt = document.createElement('div'); mt.className = 'meta'; mt.textContent = r.minutes + ' min'; front.appendChild(mt);
    var hv = document.createElement('div'); hv.className = 'have';
    hv.textContent = s.matched + ' of ' + s.n + ' in the pantry' + (s.soon ? ' · use soon' : ''); front.appendChild(hv);

    var back = document.createElement('div'); back.className = 'face back';
    var bn = document.createElement('div'); bn.className = 'name'; bn.textContent = r.name; back.appendChild(bn);
    var ul = document.createElement('ul'); ul.className = 'ing';
    r.ingredients.forEach(function (ing) {
      var li = document.createElement('li'); li.className = ing.have ? 'yes' : 'no'; li.textContent = ing.name; ul.appendChild(li);
    });
    back.appendChild(ul);
    if (isStart && r.steps && r.steps.length) {
      var ol = document.createElement('ol'); ol.className = 'steps';
      r.steps.forEach(function (t) { var li = document.createElement('li'); li.textContent = t; ol.appendChild(li); });
      back.appendChild(ol);
    } else if (r.steps && r.steps.length) {
      var tip = document.createElement('p'); tip.className = 'meta'; tip.textContent = 'Start it to see the steps.'; back.appendChild(tip);
    }
    var btns = document.createElement('div'); btns.className = 'btns';
    var b1 = document.createElement('button'); b1.type = 'button'; b1.textContent = isFav ? '⭐ Favourite' : '☆ Favourite';
    b1.addEventListener('click', function (e) { e.stopPropagation(); toggle(fav, KEY_FAV, r.id); render(); share(r); });
    var b2 = document.createElement('button'); b2.type = 'button'; b2.textContent = isStart ? '▶ Started' : '▷ Start this';
    b2.addEventListener('click', function (e) { e.stopPropagation(); toggle(started, KEY_START, r.id); render(); reopen(r.id); share(r); });
    var a = document.createElement('a'); a.href = googleUrl(r.name); a.target = '_blank'; a.rel = 'noopener'; a.textContent = '🔎 See versions';
    a.addEventListener('click', function (e) { e.stopPropagation(); });
    var b3 = document.createElement('button'); b3.type = 'button'; b3.textContent = 'Back';
    b3.addEventListener('click', function (e) { e.stopPropagation(); flip.classList.remove('open'); });
    btns.appendChild(b1); btns.appendChild(b2); btns.appendChild(a); btns.appendChild(b3);
    back.appendChild(btns);

    inner.appendChild(front); inner.appendChild(back); flip.appendChild(inner);
    flip.addEventListener('click', function () { flip.classList.toggle('open'); });
    return flip;
  }

  // Keep the card turned over after a re-render, so the steps show at once.
  function reopen(id) { var el = document.querySelector('.flip[data-id="' + id + '"]'); if (el) el.classList.add('open'); }

  // ---- family database: favourites and starts are rows in wtc_recipes, keyed by "explore:<id>" in notes.
  // Start = wish (on the list to cook). Device copy first; the database wins when it has a row.
  var DB = window.WTCDb, remote = {};
  function setSave(msg) { $('saveState').textContent = msg; }
  function setIn(list, id, on) { var at = list.indexOf(id); if (on && at === -1) list.push(id); if (!on && at !== -1) list.splice(at, 1); }
  function saveRemote(r) {
    if (!DB || !DB.session()) return Promise.resolve();
    var body = { favourite: fav.indexOf(r.id) !== -1, wish: started.indexOf(r.id) !== -1, updated_at: new Date().toISOString() };
    var row = remote[r.id];
    if (row) return DB.patch('wtc_recipes', 'id=eq.' + row.id, body).then(function () { row.favourite = body.favourite; row.wish = body.wish; });
    body.name = r.name;
    body.notes = 'explore:' + r.id + ' (from the recipe book, explore)';
    return DB.insert('wtc_recipes', [body]).then(function (res) { var made = res.data && res.data[0]; if (made) remote[r.id] = made; });
  }
  function share(r) {
    if (!DB || !DB.session()) { setSave('Kept on this device. Sign in on the Pantry page to share with the family.'); return; }
    setSave('Saving…');
    saveRemote(r).then(function () { setSave('Saved to the family database.'); },
      function (e) { setSave('Not saved to the family database: ' + DB.explain(e) + ' This device keeps it.'); });
  }
  function loadRemote() {
    if (!DB || !DB.session()) { setSave('Favourites and starts are kept on this device. Sign in on the Pantry page to share them.'); return; }
    DB.select('wtc_recipes', 'select=id,name,favourite,wish,notes&notes=like.' + encodeURIComponent('explore:') + '*').then(function (res) {
      (res.data || []).forEach(function (row) { var key = String(row.notes || '').split(' ')[0]; if (key.indexOf('explore:') === 0) remote[key.slice(8)] = row; });
      var pushes = [];
      recipes.forEach(function (r) {
        var row = remote[r.id];
        if (row) { setIn(fav, r.id, !!row.favourite); setIn(started, r.id, !!row.wish); }
        else if (fav.indexOf(r.id) !== -1 || started.indexOf(r.id) !== -1) pushes.push(r);
      });
      writeList(KEY_FAV, fav); writeList(KEY_START, started);
      render();
      return pushes.reduce(function (p, r) { return p.then(function () { return saveRemote(r); }); }, Promise.resolve());
    }).then(function () { setSave('Shared with the family database.'); },
      function (e) { setSave('Could not reach the family database: ' + DB.explain(e) + ' Showing this device.'); });
  }

  function toggle(list, key, id) {
    var at = list.indexOf(id);
    if (at === -1) list.push(id); else list.splice(at, 1);
    writeList(key, list);
  }

  function passes(r, s) {
    if (filter === 'fav') return fav.indexOf(r.id) !== -1;
    if (filter === 'have') return s.most;
    if (filter === 'soon') return s.soon;
    if (filter === 'started') return started.indexOf(r.id) !== -1;
    return true;
  }

  function render() {
    var book = $('book'); book.textContent = '';
    var sums = {}, counts = { all: 0, fav: 0, have: 0, soon: 0, started: 0 };
    recipes.forEach(function (r) {
      var s = summary(r); sums[r.id] = s;
      counts.all++;
      if (fav.indexOf(r.id) !== -1) counts.fav++;
      if (s.most) counts.have++;
      if (s.soon) counts.soon++;
      if (started.indexOf(r.id) !== -1) counts.started++;
    });
    $('cAll').textContent = counts.all; $('cFav').textContent = counts.fav; $('cHave').textContent = counts.have;
    $('cSoon').textContent = counts.soon; $('cStart').textContent = counts.started;
    var shown = 0;
    recipes.forEach(function (r, i) {
      var s = sums[r.id];
      if (!passes(r, s)) return;
      book.appendChild(card(r, i, s)); shown++;
    });
    $('empty').hidden = shown > 0;
    $('statusPill').textContent = items.length ? 'pantry: ' + inStock().length + ' in stock' : 'no pantry on this device';
  }

  document.querySelectorAll('.chip[data-filter]').forEach(function (b) {
    b.addEventListener('click', function () {
      filter = b.dataset.filter;
      document.querySelectorAll('.chip[data-filter]').forEach(function (x) { x.classList.toggle('on', x === b); });
      render();
    });
  });

  fetch('recipes_explore.json').then(function (res) { return res.json(); }).then(function (data) {
    recipes = data.recipes || [];
    items = readList(KEY_ITEMS);
    fav = readList(KEY_FAV);
    started = readList(KEY_START);
    render();
    loadRemote();
  }).catch(function () {
    $('empty').hidden = false;
    $('empty').textContent = 'Could not load the recipe list. Open this page from the nursery site.';
  });
})();
</script>
</body>
</html>
