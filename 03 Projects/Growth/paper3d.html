<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Growth: white paper in 3-D</title>
<style>
  :root {
    --bg: #f7f3e8; --ink: #2b2b2b; --card: #fffdf6; --sage: #bfe6cf; --peach: #ffd2b8; --sun: #ffe49a;
    --line: 3px solid #2b2b2b; --shadow: 0 4px 0 #2b2b2b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #2b2b2b; --ink: #f7f3e8; --card: #3a3a3a; }
  }
  :root[data-theme="dark"] { --bg: #2b2b2b; --ink: #f7f3e8; --card: #3a3a3a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto; min-height: 100vh; }
  header { padding: 12px 16px 6px; }
  h1 { margin: 0; font-size: 1.3rem; }
  .sub { margin: 4px 0 0; font-size: 0.95rem; opacity: 0.85; }
  #stage { position: relative; min-height: 320px; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #hint { position: absolute; left: 12px; top: 10px; font-size: 0.85rem; background: var(--card); border: var(--line); border-radius: 12px; padding: 4px 10px; }
  #stats { position: absolute; right: 12px; top: 10px; font-size: 0.85rem; background: var(--card); border: var(--line); border-radius: 12px; padding: 4px 10px; }
  footer { padding: 10px 16px 18px; display: grid; gap: 10px; max-width: 760px; width: 100%; margin: 0 auto; }
  #now { font-size: 1.1rem; font-weight: 700; }
  #desc { margin: 0; font-size: 1rem; line-height: 1.4; }
  .row { display: flex; gap: 10px; align-items: center; }
  .btn { flex: 0 0 auto; min-width: 68px; min-height: 56px; border: var(--line); border-radius: 16px; background: var(--sage); color: var(--ink); box-shadow: var(--shadow); font-size: 1rem; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #2b2b2b; }
  .btn svg { width: 26px; height: 26px; fill: var(--ink); }
  #slider { flex: 1; height: 44px; accent-color: #3d8bff; }
  #count { min-width: 92px; text-align: right; font-weight: 700; }
  #env { font-size: 0.85rem; opacity: 0.8; margin: 0; }
  @media (max-width: 480px) { #hint, #stats { font-size: 0.75rem; } #count { min-width: 70px; font-size: 0.9rem; } }
</style>
</head>
<body>
<header>
  <h1>Growth: white paper, in 3-D</h1>
  <p class="sub">One sheet, ten steps. Drag to turn it, pinch or scroll to zoom. The model is replayed from the story each time.</p>
</header>

<main id="stage">
  <div id="hint">Drag to turn · pinch or scroll to zoom</div>
  <div id="stats">step 0</div>
</main>

<footer>
  <div id="now">Clean sheet</div>
  <p id="desc">The paper before anything happens to it.</p>
  <div class="row">
    <button class="btn" id="back" aria-label="Back one step" title="Back">
      <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
    </button>
    <button class="btn" id="play" aria-label="Play through the steps" title="Play">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>
    </button>
    <button class="btn" id="next" aria-label="Next step" title="Next">
      <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
    </button>
    <input id="slider" type="range" min="0" max="10" step="1" value="0" aria-label="Step">
    <span id="count">0 of 10</span>
  </div>
  <p id="env"></p>
</footer>

<script src="vendor/three.min.js"></script>
<script src="js/paper_engine.js"></script>
<script src="js/paper_story.js"></script>
<script>
(function () {
  var story = window.PAPER_STORY;
  var E = window.PaperEngine;
  var stage = document.getElementById('stage');
  var total = story.steps.length;

  // --- Three.js scene. The sheet lies in the x-y plane, height is z.
  var renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.setClearColor(0xf7f3e8, 1);
  stage.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(35, 1, 0.1, 200);
  camera.up.set(0, 0, 1);

  scene.add(new THREE.AmbientLight(0xffffff, 1.0));
  var sun = new THREE.DirectionalLight(0xffffff, 0.95);
  sun.position.set(6, -9, 14);
  scene.add(sun);
  var fill = new THREE.DirectionalLight(0xfff4e0, 0.35);
  fill.position.set(-8, 6, 6);
  scene.add(fill);

  var group = new THREE.Group();
  scene.add(group);

  // Orbit state: spherical around the origin.
  var orbit = { theta: -0.35, phi: 1.0, radius: 22 };
  var TARGET = new THREE.Vector3(0, 0, 0);

  function updateCamera() {
    var s = Math.sin(orbit.phi), c = Math.cos(orbit.phi);
    camera.position.set(
      orbit.radius * s * Math.sin(orbit.theta),
      -orbit.radius * s * Math.cos(orbit.theta),
      orbit.radius * c
    );
    camera.lookAt(TARGET);
  }

  function resize() {
    var w = stage.clientWidth, h = Math.max(320, stage.clientHeight);
    renderer.setSize(w, h, false);
    renderer.domElement.style.height = h + 'px';
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // --- Input: drag to orbit, wheel or two-finger pinch to zoom.
  var pointers = new Map();
  var lastPinch = 0;
  renderer.domElement.addEventListener('pointerdown', function (e) {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    renderer.domElement.setPointerCapture(e.pointerId);
  });
  renderer.domElement.addEventListener('pointermove', function (e) {
    if (!pointers.has(e.pointerId)) return;
    var prev = pointers.get(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      orbit.theta -= (e.clientX - prev.x) * 0.008;
      orbit.phi = Math.min(Math.PI - 0.1, Math.max(0.1, orbit.phi - (e.clientY - prev.y) * 0.008));
    } else if (pointers.size === 2) {
      var pts = Array.from(pointers.values());
      var d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (lastPinch > 0) orbit.radius = Math.min(60, Math.max(6, orbit.radius * (lastPinch / d)));
      lastPinch = d;
    }
    updateCamera();
  });
  function endPointer(e) { pointers.delete(e.pointerId); if (pointers.size < 2) lastPinch = 0; }
  renderer.domElement.addEventListener('pointerup', endPointer);
  renderer.domElement.addEventListener('pointercancel', endPointer);
  renderer.domElement.addEventListener('wheel', function (e) {
    e.preventDefault();
    orbit.radius = Math.min(60, Math.max(6, orbit.radius * Math.exp(e.deltaY * 0.0015)));
    updateCamera();
  }, { passive: false });

  // --- Model: replay the story to step n and rebuild the pieces.
  var current = 0;
  var disposables = [];
  var material = new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.92, metalness: 0 });

  function show(n) {
    current = Math.max(0, Math.min(total, n));
    var st = E.replay(story, current);
    var pieces = E.toPieces(st);
    var stats = E.stats(st);

    while (group.children.length) {
      var old = group.children.pop();
      old.geometry.dispose();
    }
    pieces.forEach(function (p) {
      var g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(p.positions, 3));
      g.setAttribute('color', new THREE.BufferAttribute(p.colors, 3));
      g.computeVertexNormals();
      group.add(new THREE.Mesh(g, material));
    });

    var step = current > 0 ? story.steps[current - 1] : null;
    document.getElementById('now').textContent = step ? (step.age + '. ' + step.label) : 'Clean sheet';
    document.getElementById('desc').textContent = step ? step.description : 'The paper before anything happens to it.';
    document.getElementById('count').textContent = current + ' of ' + total;
    document.getElementById('slider').value = current;
    document.getElementById('stats').textContent = 'pieces ' + stats.pieces + ' · faces ' + stats.faces;
    document.getElementById('env').textContent = 'Environment: ' + story.environment.label + '. Synthetic test story.';
    document.getElementById('back').disabled = current === 0;
    document.getElementById('next').disabled = current === total;
  }

  // --- Controls. Play runs the steps once, then stops (no loop).
  var timer = null;
  function stopPlay() {
    if (timer) clearInterval(timer);
    timer = null;
    document.getElementById('playIcon').innerHTML = '<path d="M7 4v16l13-8z"/>';
  }
  document.getElementById('back').addEventListener('click', function () { stopPlay(); show(current - 1); });
  document.getElementById('next').addEventListener('click', function () { stopPlay(); show(current + 1); });
  document.getElementById('slider').addEventListener('input', function (e) { stopPlay(); show(parseInt(e.target.value, 10)); });
  document.getElementById('play').addEventListener('click', function () {
    if (timer) { stopPlay(); return; }
    document.getElementById('playIcon').innerHTML = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
    if (current >= total) show(0);
    timer = setInterval(function () {
      if (current >= total) { stopPlay(); return; }
      show(current + 1);
    }, 1600);
  });

  // Test hooks: the page can be driven from a script (see tests and the render step).
  window.growth3d = {
    show: function (n) { stopPlay(); show(n); },
    current: function () { return current; },
    orbit: orbit,
    setOrbit: function (theta, phi, radius) { orbit.theta = theta; orbit.phi = phi; orbit.radius = radius; updateCamera(); },
    render: function () { renderer.render(scene, camera); return renderer.domElement.toDataURL('image/png'); }
  };

  updateCamera();
  show(0);

  function loop() {
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
