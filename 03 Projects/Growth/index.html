<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Growth: describe a world, then watch time pass</title>
<style>
  :root {
    --ink: #2d2a32; --paper: #f7f1e6; --card: #fffdf8; --field: #ffffff;
    --sun: #ffe08a; --mint: #c9ecdc; --sky: #cfe4f7; --peach: #ffd9c2; --rose: #f6c6c6;
    --shadow: 0 4px 0 #2d2a32;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #f3eee6; --paper: #24212a; --card: #2f2b36; --field: #3a3640; --sun: #6b5a2a; --mint: #2e4a40; --sky: #2c3f57; --peach: #5a3f33; --rose: #5a3036; --shadow: 0 4px 0 #0d0b10; }
  }
  :root[data-theme="dark"] { --ink: #f3eee6; --paper: #24212a; --card: #2f2b36; --field: #3a3640; --sun: #6b5a2a; --mint: #2e4a40; --sky: #2c3f57; --peach: #5a3f33; --rose: #5a3036; --shadow: 0 4px 0 #0d0b10; }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { min-height: 100vh; }

  header { padding: 14px 16px 16px; background: var(--sun); border-bottom: 3px solid var(--ink); }
  .head { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  header h1 { margin: 0; font-size: 1.5rem; }
  header p { margin: 0; }
  .picker { display: flex; align-items: center; gap: 10px; font-weight: bold; flex-wrap: wrap; }
  .picker select { width: auto; max-width: 100%; min-width: 0; box-shadow: var(--shadow); }
  .picker { min-width: 0; }
  #status { font-size: 0.9rem; opacity: 0.85; }

  main { max-width: 900px; margin: 0 auto; padding: 16px 16px 140px; display: grid; gap: 18px; }

  .sec { background: var(--card); border: 3px solid var(--ink); border-radius: 18px; box-shadow: var(--shadow); padding: 16px 16px 18px; display: grid; gap: 12px; }
  .sec h2 { margin: 0; font-size: 1.25rem; display: flex; align-items: center; gap: 10px; }
  .badge { width: 38px; height: 38px; min-width: 38px; border-radius: 50%; background: var(--sun); border: 3px solid var(--ink); display: inline-grid; place-items: center; font-weight: bold; }
  .say { margin: 0; font-style: italic; opacity: 0.85; }
  h3 { margin: 6px 0 0; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .help { margin: 0; font-size: 0.9rem; opacity: 0.85; }

  input, textarea, select {
    font: inherit; color: var(--ink); background: var(--field);
    border: 3px solid var(--ink); border-radius: 12px; padding: 10px 12px; min-height: 48px; width: 100%;
  }
  textarea { resize: vertical; line-height: 1.4; }
  input.bad { border-color: #c0392b; background: var(--rose); }
  input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline: 3px dashed var(--ink); outline-offset: 3px; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.85rem; }

  .btn {
    font: inherit; color: var(--ink); background: var(--mint); text-decoration: none;
    border: 3px solid var(--ink); border-radius: 14px; min-height: 52px; min-width: 52px; padding: 0 18px;
    box-shadow: var(--shadow); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
  }
  .btn:active { transform: translateY(3px); box-shadow: none; }
  .btn.alt { background: var(--sky); }
  .btn.warm { background: var(--peach); }
  .btn.small { min-height: 48px; padding: 0 14px; }
  .btn[disabled], .btn[aria-disabled="true"] { opacity: 0.55; border-style: dashed; box-shadow: none; cursor: not-allowed; }

  .kinds { display: flex; gap: 8px; flex-wrap: wrap; }
  .kinds input { position: absolute; opacity: 0; width: 1px; height: 1px; min-height: 0; }
  .kinds label { border: 3px solid var(--ink); border-radius: 999px; padding: 10px 18px; min-height: 48px; display: inline-flex; align-items: center; background: var(--field); cursor: pointer; box-shadow: var(--shadow); }
  .kinds input:checked + label { background: var(--sun); font-weight: bold; }
  .kinds input:focus-visible + label { outline: 3px dashed var(--ink); outline-offset: 3px; }

  .row { display: grid; gap: 8px; align-items: center; }
  .row > *, .cell { min-width: 0; }
  .r5 { grid-template-columns: 2fr 1.2fr 1.4fr 3fr auto; }
  .r4 { grid-template-columns: 2fr 1fr 1fr auto; }
  .r2 { grid-template-columns: 1fr auto; }
  .tag { font-size: 0.78rem; opacity: 0.75; margin: -4px 0 0 4px; }
  .cell { display: grid; gap: 2px; }
  .reads { margin: 0; font-size: 0.92rem; padding: 8px 12px; border-left: 4px solid var(--ink); background: var(--paper); border-radius: 0 10px 10px 0; }
  .reads:empty { display: none; }

  .chartbox { background: var(--field); border: 3px solid var(--ink); border-radius: 14px; padding: 8px; }
  .chartbox svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 8px 4px 2px; font-size: 0.9rem; }
  .legend span::before { content: ""; display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 6px; vertical-align: -2px; background: var(--c); border: 2px solid var(--ink); }
  .read ul { margin: 6px 0 0; padding-left: 20px; }

  details.fold { border: 3px solid var(--ink); border-radius: 12px; background: var(--card); padding: 0 12px 12px; display: block; }
  details.fold > summary { cursor: pointer; font-weight: bold; min-height: 48px; display: flex; align-items: center; }
  details.fold[open] > summary { margin-bottom: 8px; }
  details.fold > * + * { margin-top: 8px; }
  .story { margin: 0; }
  .story.land { font-style: italic; opacity: 0.9; }
  .story.empty { opacity: 0.6; font-style: italic; }
  .stepcard { border: 3px solid var(--ink); border-radius: 14px; padding: 12px; background: var(--paper); display: grid; gap: 8px; }
  .stephead { font-weight: bold; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .stephead small { font-weight: normal; opacity: 0.8; }
  .needs { background: var(--rose); border: 2px solid var(--ink); border-radius: 999px; padding: 0 10px; font-size: 0.8rem; font-weight: normal; }
  .nums { display: flex; flex-wrap: wrap; gap: 6px; }
  .nums span { background: var(--card); border: 2px solid var(--ink); border-radius: 999px; padding: 2px 10px; font-size: 0.88rem; }

  .outs { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
  .out { border: 3px solid var(--ink); border-radius: 14px; padding: 12px; background: var(--paper); display: grid; gap: 8px; align-content: start; }
  .out strong { font-size: 1.05rem; }
  .out p { margin: 0; font-size: 0.9rem; }
  .msg { margin: 0; font-size: 0.92rem; font-weight: bold; }
  .msg.ok { color: #1d6b43; }
  .msg.err { color: #b02a2a; }
  @media (prefers-color-scheme: dark) { .msg.ok { color: #8fe0b0; } .msg.err { color: #ffa5a5; } }

  /* Settings gear, lower right (the nursery's anchor for options) */
  #gear { position: fixed; right: 16px; bottom: 16px; width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--ink); background: var(--sun); font-size: 1.6rem; box-shadow: var(--shadow); cursor: pointer; z-index: 20; }
  #errCount { position: absolute; top: -6px; right: -6px; min-width: 24px; height: 24px; border-radius: 12px; background: #c0392b; color: #fff; font-size: 0.8rem; display: inline-grid; place-items: center; border: 2px solid var(--ink); }
  #drawer { position: fixed; right: 16px; bottom: 92px; width: min(440px, calc(100vw - 32px)); max-height: calc(100vh - 120px); overflow: auto; background: var(--card); border: 3px solid var(--ink); border-radius: 18px; box-shadow: var(--shadow); padding: 14px; display: grid; gap: 12px; z-index: 20; }
  #drawer[hidden], #errors[hidden], #errCount[hidden] { display: none; }
  #drawer h2 { margin: 0; font-size: 1.1rem; }
  .check { display: flex; align-items: center; gap: 10px; min-height: 48px; }
  .check input { width: 28px; height: 28px; min-height: 0; accent-color: var(--ink); }
  #errors { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: #3a1f24; color: #ffe3e3; padding: 10px 96px 10px 16px; max-height: 32vh; overflow: auto; }
  #errors pre { margin: 0; white-space: pre-wrap; font-size: 0.8rem; }

  @media (max-width: 760px) {
    .r5, .r4 { grid-template-columns: 1fr 1fr; }
    .r5 .wide, .r4 .wide { grid-column: 1 / -1; }
    .r5 .x, .r4 .x { grid-column: 1 / -1; justify-self: end; }
    main { padding: 12px 12px 140px; }
  }
</style>
</head>
<body>
<header>
  <div class="head">
    <h1>Growth</h1>
    <p>Describe a world, set its rules, and read how time passes. Planning first, then the viewers.</p>
    <label class="picker">World
      <select id="worldPick" aria-label="Choose a world"></select>
    </label>
    <div id="status" aria-live="polite"></div>
  </div>
</header>

<main id="doc" aria-label="The world, written like a prompt"></main>

<button id="gear" aria-label="Settings" aria-expanded="false" title="Settings">⚙️<span id="errCount" hidden></span></button>

<aside id="drawer" hidden aria-label="Settings">
  <h2>Settings</h2>
  <label class="check"><input type="checkbox" id="showErrors"> Show errors at the bottom of the page</label>
  <div>
    <h3>This world</h3>
    <p class="help">Your edits are saved on this device. Reset puts the example back.</p>
    <button class="btn warm small" id="resetWorld">Reset to the example</button>
  </div>
  <div>
    <h3>Import a world</h3>
    <p class="help">Paste a world exported from this page.</p>
    <textarea id="importText" rows="4" class="mono" aria-label="World JSON"></textarea>
    <button class="btn alt small" id="importWorld">Use this world</button>
    <p class="msg" id="importMsg"></p>
  </div>
</aside>

<div id="errors" hidden role="log" aria-label="Errors"><pre id="errorList">No errors.</pre></div>

<script src="js/growth_model.js"></script>
<script src="worlds/index.js"></script>
<script src="worlds/rabbits_hillside.js"></script>
<script src="worlds/paper_decay.js"></script>
<script src="js/app.js"></script>
</body>
</html>
