<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Athena's world</title>
  <style>
    :root {
      --paper: #FFF9EE;
      --ink: #3b3a4a;
      --peach: #F9C8A8;
      --mint: #CDEFE0;
      --coral: #F08A7E;
      --butter: #FBE9A6;
      --line: 3px solid var(--ink);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }

    /* Landscape: room on the left, side buttons on the right */
    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 18px;
      height: 100vh;
      height: 100dvh;
      padding: 18px;
    }
    .play {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }
    h1 { margin: 0; font-size: clamp(26px, 4vw, 36px); text-align: center; }
    .hint { margin: 6px 0 12px; text-align: center; font-size: 18px; min-height: 1.4em; }

    /* The white room: walls above the line, floor below */
    .room {
      position: relative;
      width: 100%;
      max-width: calc((100dvh - 170px) * 4 / 3);
      aspect-ratio: 4 / 3;
      margin: 0 auto;
      background: #fff;
      border: var(--line);
      border-radius: 26px 32px 28px 34px;
      box-shadow: 0 6px 0 var(--ink);
      overflow: hidden;
      cursor: pointer;
    }
    .wall {
      position: absolute;
      left: 0; right: 0; top: 0;
      height: 42%;
      border-bottom: var(--line);
    }
    .floor {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 58%;
    }

    .item {
      position: absolute;
      transform: translate(-50%, -50%);
      padding: 4px;
      background: none;
      border: 0;
      border-radius: 18px;
      font-size: clamp(46px, 8vw, 76px);
      line-height: 1;
      cursor: pointer;
      filter: drop-shadow(0 4px 0 rgba(59, 58, 74, 0.25));
      transition: left 0.4s ease, top 0.4s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .item.held {
      animation: bob 1s ease-in-out infinite;
      outline: 3px dashed var(--coral);
      outline-offset: 6px;
    }
    @keyframes bob {
      0%, 100% { transform: translate(-50%, -50%); }
      50% { transform: translate(-50%, -62%); }
    }

    /* Side buttons */
    .side {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      min-height: 0;
      padding: 4px 6px 100px 0;
    }
    .side h2 { margin: 8px 0 0; font-size: 18px; }
    .stack { display: grid; gap: 10px; }
    .btn {
      min-height: 68px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      font: 700 19px system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--mint);
      border: var(--line);
      border-radius: 22px 26px 24px 28px;
      box-shadow: 0 4px 0 var(--ink);
      cursor: pointer;
      text-align: left;
    }
    .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
    .btn[aria-pressed="true"] { background: var(--butter); }
    .btn:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: 0 4px 0 var(--ink); }
    .btn.ghost { background: var(--paper); }

    /* Settings gear, lower right */
    .gear {
      position: fixed;
      right: 18px;
      bottom: calc(18px + env(safe-area-inset-bottom));
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      font-size: 30px;
      background: var(--peach);
      border: var(--line);
      border-radius: 50%;
      box-shadow: 0 4px 0 var(--ink);
      cursor: pointer;
      z-index: 30;
    }
    .drawer {
      position: fixed;
      right: 18px;
      bottom: 100px;
      width: min(360px, 92vw);
      max-height: 70vh;
      overflow-y: auto;
      padding: 14px;
      background: var(--paper);
      border: var(--line);
      border-radius: 24px;
      box-shadow: 0 6px 0 var(--ink);
      z-index: 40;
    }
    .drawerHead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .drawerHead h2 { margin: 0; font-size: 22px; }
    .mini {
      min-width: 48px;
      min-height: 48px;
      font-size: 20px;
      background: #fff;
      border: var(--line);
      border-radius: 14px;
      cursor: pointer;
    }
    .setting { padding: 10px 0; display: grid; gap: 8px; }
    .setting > label { font-weight: 700; font-size: 17px; }
    .sub { font-size: 14px; margin: 0; }
    .seg { display: flex; gap: 8px; }
    .seg button {
      flex: 1;
      min-height: 52px;
      font: 700 18px system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background: #fff;
      border: var(--line);
      border-radius: 16px;
      cursor: pointer;
    }
    .seg button.on { background: var(--mint); }
    .toggle { display: flex; align-items: center; gap: 10px; min-height: 48px; font-weight: 700; font-size: 17px; }
    .toggle input { width: 26px; height: 26px; }
    .notesBox { display: grid; gap: 8px; }
    .notesBox textarea {
      font: 17px system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 10px;
      border: var(--line);
      border-radius: 14px;
      background: #fff;
      color: var(--ink);
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .row button, .row select {
      min-height: 48px;
      padding: 0 12px;
      font: 700 16px system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background: #fff;
      border: var(--line);
      border-radius: 14px;
      cursor: pointer;
    }
    .noteList { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-height: 26vh; overflow-y: auto; }
    .noteList li {
      background: #fff;
      border: 2px solid var(--ink);
      border-radius: 14px;
      padding: 8px 10px;
      font-size: 15px;
      white-space: pre-wrap;
    }
    .info { font-size: 14px; line-height: 1.5; }
    .info ul { margin: 4px 0 0; padding-left: 20px; }

    /* Errors: opt-in, at the bottom, clear of the gear */
    .errorsPanel {
      position: fixed;
      left: 16px;
      right: 100px;
      bottom: 16px;
      max-height: 30vh;
      overflow: auto;
      z-index: 25;
      padding: 8px 12px;
      background: #fff0ee;
      border: var(--line);
      border-radius: 16px;
      font: 14px ui-monospace, Menlo, monospace;
      white-space: pre-wrap;
    }

    /* Finished-house card */
    .modal {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(59, 58, 74, 0.25);
      z-index: 10;
    }
    .card {
      width: min(420px, 100%);
      display: grid;
      gap: 12px;
      padding: 26px;
      text-align: center;
      background: var(--mint);
      border: var(--line);
      border-radius: 30px;
      box-shadow: 0 6px 0 var(--ink);
    }
    .cheer { font-size: 60px; line-height: 1; }
    .card h2 { margin: 0; font-size: 30px; }
    .card p { margin: 0; font-size: 18px; }

    /* Portrait or narrow: stack the room above the buttons */
    @media (max-aspect-ratio: 4/5), (max-width: 700px) {
      body { overflow: auto; }
      .app { grid-template-columns: 1fr; height: auto; min-height: 100dvh; }
      .room { max-width: 100%; }
      .side { overflow: visible; padding-bottom: 110px; }
    }

    @media print { .gear, .drawer, .errorsPanel { display: none !important; } }
  </style>
</head>
<body>
  <div class="app">
    <section class="play">
      <h1 id="title"></h1>
      <p class="hint" id="hint"></p>
      <div class="room" id="room" aria-label="Room">
        <div class="wall"></div>
        <div class="floor"></div>
      </div>
    </section>

    <aside class="side">
      <h2>Who is it for?</h2>
      <div class="stack" id="houses"></div>
      <h2>Decorate</h2>
      <div class="stack" id="items"></div>
      <button class="btn ghost" id="undo" type="button">↩️ Undo</button>
    </aside>
  </div>

  <button class="gear" id="gear" type="button" aria-label="Settings" aria-expanded="false" aria-controls="drawer">⚙️</button>

  <aside class="drawer" id="drawer" hidden>
    <div class="drawerHead">
      <h2>Settings</h2>
      <button class="mini" id="closeDrawer" type="button" aria-label="Close">✖</button>
    </div>

    <div class="setting">
      <label>Sound</label>
      <div class="seg" data-key="sound">
        <button type="button" data-v="1">On</button>
        <button type="button" data-v="0">Off</button>
      </div>
    </div>

    <div class="setting">
      <button class="btn" id="clear" type="button">🧹 Empty this house</button>
      <p class="sub">Takes everything out of this house. Undo brings it back.</p>
    </div>

    <div class="setting">
      <label class="toggle"><input type="checkbox" id="showErrors"> Show errors</label>
    </div>

    <div class="setting notesBox" id="notesBox">
      <label>Notes for improvement</label>
      <textarea id="noteText" rows="3" placeholder="What would make this better?"></textarea>
      <div class="row">
        <button id="noteSave" type="button">Save note</button>
        <button id="noteCopy" type="button">Copy notes</button>
        <select id="noteFilter" aria-label="Show notes">
          <option value="open">Open</option>
          <option value="all">All</option>
        </select>
      </div>
      <ul class="noteList" id="noteList"></ul>
    </div>

    <div class="setting info">
      <label>About</label>
      <div>Version <span id="version"></span></div>
      <ul>
        <li><b>0.2.0</b> Settings, notes for improvement, error panel, version info.</li>
        <li><b>0.1.0</b> First playable: white room, houses, things, tap to move, Undo, next house.</li>
      </ul>
    </div>
  </aside>

  <div class="errorsPanel" id="errorsPanel" hidden></div>

  <div class="modal" id="done" hidden>
    <div class="card">
      <div class="cheer" aria-hidden="true">🎉</div>
      <h2>Lovely home!</h2>
      <p id="donetext"></p>
      <button class="btn" id="next" type="button"></button>
      <button class="btn ghost" id="stay" type="button">Keep decorating</button>
    </div>
  </div>

  <script>
    // ---- Houses and things. Edit these lists to change the game. ----
    const VERSION = '0.2.0';
    const HOUSES = [
      { name: "Athena's house", needs: ['bed', 'window', 'picture'] },
      { name: 'Cosy house', needs: ['bed', 'sofa', 'window'] },
      { name: 'Workplace: the shop', needs: ['window', 'picture', 'plant'] }
    ];
    const ITEMS = {
      bed:     { emoji: '🛏️', label: 'bed',     zone: 'floor' },
      sofa:    { emoji: '🛋️', label: 'sofa',    zone: 'floor' },
      plant:   { emoji: '🪴', label: 'plant',   zone: 'floor' },
      window:  { emoji: '🪟', label: 'window',  zone: 'wall' },
      picture: { emoji: '🖼️', label: 'picture', zone: 'wall' }
    };
    // Where items may sit, as % of the room (top to bottom)
    const ZONES = { wall: { top: 12, bottom: 34 }, floor: { top: 52, bottom: 92 } };
    const LEFT_RIGHT = { min: 8, max: 92 };
    const TRAY = { x: 50, y: 14 }; // a new item appears up here first

    // ---- Small helpers ----
    const $ = id => document.getElementById(id);
    const roomEl = $('room');
    const itemEls = {};
    const store = {
      get(key, fallback) {
        try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
        catch (e) { return fallback; }
      },
      set(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* private window: fine */ }
      }
    };
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    const cap = s => s[0].toUpperCase() + s.slice(1);

    // ---- Errors: always recorded, shown only when "Show errors" is on ----
    const errors = [];
    function logError(message) {
      errors.push(new Date().toLocaleTimeString() + '  ' + message);
      renderErrors();
    }
    function renderErrors() {
      const box = $('errorsPanel');
      box.hidden = !settings.showErrors;
      box.textContent = errors.length ? errors.join('\n') : 'No problems so far.';
    }
    window.addEventListener('error', e => logError(e.message));
    window.addEventListener('unhandledrejection', e => logError(String(e.reason)));

    // ---- Settings (one object, saved on this device) ----
    const DEFAULTS = { sound: 1, showErrors: false };
    let settings = { ...DEFAULTS, ...store.get('athena.settings', {}) };
    const saveSettings = () => store.set('athena.settings', settings);

    // ---- Notes for improvement (saved on this device, sent nowhere) ----
    let notes = store.get('athena.notes', []);
    const saveNotes = () => store.set('athena.notes', notes);
    let noteWhere = { page: 'index.html', item: '', label: '' };
    function setNoteContext(label, item) {
      noteWhere = { page: 'index.html', item: item || '', label: label };
    }
    function renderNotes() {
      const filter = $('noteFilter').value;
      const list = $('noteList');
      list.replaceChildren(...notes
        .filter(n => filter === 'all' || n.status === 'open')
        .slice()
        .sort((a, b) => a.at < b.at ? 1 : -1)
        .map(n => {
          const li = document.createElement('li');
          const where = n.where && n.where.label ? n.where.label + ' · ' : '';
          li.textContent = (n.status === 'done' ? '✅ ' : '📝 ') + where + new Date(n.at).toLocaleString() + '\n' + n.text;
          return li;
        }));
    }
    function addNote() {
      const box = $('noteText');
      const text = box.value.trim();
      if (!text) return;
      notes.push({
        id: 'n-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
        at: new Date().toISOString(),
        status: 'open',
        text: text,
        where: noteWhere,
        version: VERSION
      });
      box.value = '';
      saveNotes();
      renderNotes();
    }
    $('noteSave').onclick = addNote;
    $('noteFilter').onchange = renderNotes;
    $('noteCopy').onclick = () => {
      const out = JSON.stringify(notes, null, 2);
      if (navigator.clipboard) navigator.clipboard.writeText(out).catch(() => window.prompt('Copy the notes:', out));
      else window.prompt('Copy the notes:', out);
    };

    // ---- State ----
    let unlocked = store.get('athena.unlocked', 1);   // how many houses can be chosen
    let current = 0;
    let held = null;                                   // the item waiting for a tap
    const rooms = HOUSES.map(() => ({ pos: {}, history: [], done: false }));
    const room = () => rooms[current];

    // ---- Sound (Web Audio, no files) ----
    let audio = null;
    function blip(freq, dur = 0.12, type = 'sine') {
      if (!settings.sound) return;
      try {
        audio = audio || new (window.AudioContext || window.webkitAudioContext)();
        const o = audio.createOscillator();
        const g = audio.createGain();
        o.type = type;
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, audio.currentTime);
        g.gain.exponentialRampToValueAtTime(0.25, audio.currentTime + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
        o.connect(g).connect(audio.destination);
        o.start();
        o.stop(audio.currentTime + dur + 0.02);
      } catch (e) { /* no audio here: fine */ }
    }
    function fanfare() {
      [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => blip(f, 0.25, 'triangle'), i * 140));
    }

    // ---- Rules ----
    const isPlaced = (R, t) => !!R.pos[t] && R.pos[t].placed && held !== t;
    const isComplete = R => HOUSES[current].needs.every(t => isPlaced(R, t));
    const placedCopy = R => {
      const copy = {};
      for (const t in R.pos) if (R.pos[t].placed) copy[t] = { ...R.pos[t] };
      return copy;
    };
    // Drop a new item that was never put down, so it doesn't stay in the tray
    function discardUnplacedHeld() {
      const R = room();
      if (held && R.pos[held] && !R.pos[held].placed) delete R.pos[held];
      held = null;
    }

    function pressItem(t) {
      const R = room();
      if (held === t) {
        // Tapping the held item again puts it down where it is
        if (R.pos[t].placed) { held = null; blip(440, 0.08); }
        render();
        return;
      }
      discardUnplacedHeld();
      if (!R.pos[t]) R.pos[t] = { x: TRAY.x, y: TRAY.y, placed: false }; // new item appears up here
      held = t;
      setNoteContext(`${HOUSES[current].name} · ${ITEMS[t].label}`, `house-${current}/${t}`);
      blip(520, 0.08);
      render();
    }

    roomEl.addEventListener('click', e => {
      if (!held) return;
      const r = roomEl.getBoundingClientRect();
      const zone = ZONES[ITEMS[held].zone];
      const x = clamp((e.clientX - r.left) / r.width * 100, LEFT_RIGHT.min, LEFT_RIGHT.max);
      const y = clamp((e.clientY - r.top) / r.height * 100, zone.top, zone.bottom);
      const R = room();
      const wasDone = R.done;
      R.history.push(placedCopy(R));
      R.pos[held] = { x, y, placed: true };
      held = null;
      blip(880, 0.12);
      R.done = isComplete(R);
      if (R.done && !wasDone) finishHouse();
      render();
    });

    $('undo').onclick = () => {
      const R = room();
      if (!R.history.length) return;
      R.pos = R.history.pop();
      held = null;
      R.done = isComplete(R);
      render();
    };

    function finishHouse() {
      unlocked = Math.max(unlocked, Math.min(current + 2, HOUSES.length));
      store.set('athena.unlocked', unlocked);
      $('donetext').textContent = `${HOUSES[current].name} is all decorated.`;
      $('next').textContent = current + 1 < HOUSES.length ? 'Next house ➜' : 'Yay! 🌟';
      $('done').hidden = false;
      fanfare();
    }

    function selectHouse(i) {
      if (i >= unlocked) return;
      discardUnplacedHeld();
      current = i;
      setNoteContext(HOUSES[current].name, `house-${current}`);
      for (const t in itemEls) { itemEls[t].remove(); delete itemEls[t]; }
      render();
    }

    // ---- Drawing ----
    function render() {
      const R = room();

      // Items in the room (kept as elements so they glide when moved)
      for (const t in itemEls) if (!R.pos[t]) { itemEls[t].remove(); delete itemEls[t]; }
      for (const t in R.pos) {
        let el = itemEls[t];
        if (!el) {
          el = document.createElement('button');
          el.type = 'button';
          el.className = 'item';
          el.textContent = ITEMS[t].emoji;
          el.setAttribute('aria-label', ITEMS[t].label);
          el.addEventListener('click', e => { e.stopPropagation(); pressItem(t); });
          roomEl.appendChild(el);
          itemEls[t] = el;
        }
        el.style.left = R.pos[t].x + '%';
        el.style.top = R.pos[t].y + '%';
        el.classList.toggle('held', held === t);
      }

      // Side buttons
      $('houses').replaceChildren(...HOUSES.map((h, i) => {
        const locked = i >= unlocked;
        const b = button((locked ? '🔒 ' : rooms[i].done ? '⭐ ' : '') + h.name);
        b.disabled = locked;
        b.setAttribute('aria-pressed', i === current);
        b.onclick = () => selectHouse(i);
        return b;
      }));
      $('items').replaceChildren(...HOUSES[current].needs.map(t => {
        const b = button(`${ITEMS[t].emoji} ${cap(ITEMS[t].label)}${isPlaced(R, t) ? ' ✓' : ''}`);
        b.setAttribute('aria-pressed', held === t);
        b.onclick = () => pressItem(t);
        return b;
      }));
      $('undo').disabled = !R.history.length;

      // Words above the room
      $('title').textContent = HOUSES[current].name;
      $('hint').textContent = held
        ? `Tap the room to put the ${ITEMS[held].label} there.`
        : Object.keys(R.pos).length ? 'Tap something in the room to move it.' : 'Tap something on the right to start.';

      renderSettings();
    }

    function renderSettings() {
      document.querySelectorAll('.seg').forEach(seg => {
        const v = String(settings[seg.dataset.key]);
        seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
      });
      $('showErrors').checked = !!settings.showErrors;
      renderErrors();
    }

    function button(text) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn';
      b.textContent = text;
      return b;
    }

    // ---- Settings drawer ----
    const gear = $('gear'), drawer = $('drawer');
    const setOpen = open => { drawer.hidden = !open; gear.setAttribute('aria-expanded', String(open)); };
    gear.onclick = () => setOpen(drawer.hidden);
    $('closeDrawer').onclick = () => setOpen(false);
    document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
      const v = b.dataset.v;
      settings[b.parentElement.dataset.key] = +v;
      saveSettings();
      renderSettings();
      if (b.parentElement.dataset.key === 'sound' && +v === 1) blip(660, 0.1);
    }));
    $('showErrors').onchange = e => { settings.showErrors = e.target.checked; saveSettings(); renderErrors(); };
    $('clear').onclick = () => {
      const R = room();
      if (!Object.keys(R.pos).length) return;
      R.history.push(placedCopy(R));
      R.pos = {};
      held = null;
      R.done = false;
      setOpen(false);
      render();
    };
    $('version').textContent = VERSION;
    $('next').onclick = () => {
      $('done').hidden = true;
      if (current + 1 < HOUSES.length) selectHouse(current + 1);
      else render();
    };
    $('stay').onclick = () => { $('done').hidden = true; };

    setNoteContext(HOUSES[current].name, `house-${current}`);
    renderNotes();
    render();
  </script>
</body>
</html>
