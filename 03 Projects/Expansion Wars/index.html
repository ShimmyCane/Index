<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Expansion Wars</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1>Expansion Wars</h1>
    <p id="status" class="pill">Drag from your mushroom to a connected one</p>
  </header>

  <main class="stage">
    <div id="board" class="board">
      <svg id="roads" class="layer" viewBox="0 0 1000 640"></svg>
      <div id="nodes" class="layer"></div>
      <svg id="armies" class="layer" viewBox="0 0 1000 640"></svg>
    </div>
  </main>

  <div id="overlay" class="overlay" hidden>
    <div class="card">
      <h2 id="win-title"></h2>
      <p id="win-text"></p>
      <button id="again" class="big">Play again</button>
    </div>
  </div>

  <div id="maps" class="overlay" hidden>
    <div class="card maps-card">
      <h2>Saved maps</h2>
      <div id="maps-list" class="maps-list"></div>
      <button id="maps-close" class="big">Close</button>
    </div>
  </div>

  <button id="gear" class="gear" aria-label="Settings">⚙️</button>

  <section id="panel" class="panel" hidden>
    <h2>Settings</h2>
    <div class="row">
      <span>Level</span>
      <div class="seg" id="seg-level">
        <button data-level="1" aria-pressed="true">1</button>
        <button data-level="2" aria-pressed="false">2</button>
        <button data-level="3" aria-pressed="false">3</button>
        <button data-level="4" aria-pressed="false">4</button>
      </div>
    </div>
    <div class="row">
      <span>Computer</span>
      <div class="seg" id="seg-ai">
        <button data-ai="easy" aria-pressed="false">Easy</button>
        <button data-ai="normal" aria-pressed="true">Normal</button>
      </div>
    </div>
    <div class="row">
      <span>Sound</span>
      <button id="sound" class="toggle" aria-pressed="true">On</button>
    </div>
    <button id="newmap" class="big">New map</button>
    <button id="open-maps" class="big">Saved maps</button>
    <div class="note-box">
      <label for="note-text">Notes for improvement</label>
      <textarea id="note-text" rows="2" maxlength="500" placeholder="What could be better on this map?"></textarea>
      <button id="note-save" class="big">Save note</button>
      <p id="note-status" class="muted" aria-live="polite"></p>
    </div>
    <div class="row">
      <span>Show errors</span>
      <button id="errors-toggle" class="toggle" aria-pressed="false">Off</button>
    </div>
  </section>

  <div id="errors" class="errors" hidden></div>

  <script src="js/sound.js"></script>
  <script src="js/map.js"></script>
  <script src="js/store.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
