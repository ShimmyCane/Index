<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compose</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎛️%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/companion.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/compose.css">
</head>
<body class="compPage">
<header class="bar">
  <a class="btn icon" href="index.html" aria-label="Record">🎹</a>
  <h1>🎛️ Compose</h1>
  <button class="pill" id="pill" type="button">💾 this device</button>
</header>
<main class="wrap">
  <section class="panel" data-panel="transport">
    <button class="panelHead" type="button" aria-expanded="true"><span>▶️</span><span class="panelTitle">Play</span><span class="panelMark">▾</span></button>
    <div class="panelBody">
      <div class="transport">
        <button class="btn icon big" id="play" type="button" aria-label="Play">▶</button>
        <button class="btn icon" id="stop" type="button" aria-label="Back to start">⏮</button>
        <button class="btn icon" id="loop" type="button" aria-label="Loop" aria-pressed="false">🔁</button>
        <button class="btn icon" id="undo" type="button" aria-label="Undo">↩️</button>
        <button class="btn icon" id="redo" type="button" aria-label="Redo">↪️</button>
        <span class="time" id="clock">0:00 / 0:00</span>
        <label class="zoom">🔍 <input type="range" id="zoom" min="10" max="120" value="40" aria-label="Zoom"></label>
      </div>
    </div>
  </section>

  <section class="panel" data-panel="timeline">
    <button class="panelHead" type="button" aria-expanded="true"><span>🎚️</span><span class="panelTitle">Four layers</span><span class="panelMark">▾</span></button>
    <div class="panelBody">
      <div class="tl">
        <div class="heads" id="heads"></div>
        <div class="scroller" id="scroller">
          <div class="lanes" id="lanes"><div class="playhead" id="playhead"></div></div>
        </div>
      </div>
      <p class="hint">Tap a clip to pick it. Drag it to move it, or drag its left or right edge to snip it. Tap an empty spot to set the play position.</p>
    </div>
  </section>

  <section class="panel" data-panel="clip">
    <button class="panelHead" type="button" aria-expanded="true"><span>✂️</span><span class="panelTitle" id="clipTitle">The picked clip</span><span class="panelMark">▾</span></button>
    <div class="panelBody" id="inspector"></div>
  </section>

  <section class="panel" data-panel="takes">
    <button class="panelHead" type="button" aria-expanded="true"><span>🎹</span><span class="panelTitle">Add a take</span><span class="panelMark">▾</span></button>
    <div class="panelBody"><p class="hint" id="addHint"></p><div class="pickList" id="pick"></div></div>
  </section>

  <section class="panel" data-panel="project" data-open="false">
    <button class="panelHead" type="button" aria-expanded="false"><span>💾</span><span class="panelTitle">Project</span><span class="panelMark">▾</span></button>
    <div class="panelBody" id="projectBody"></div>
  </section>
</main>
<script src="js/app.js"></script>
<script src="js/family.js"></script>
<script src="js/store.js"></script>
<script src="js/notes.js"></script>
<script src="js/chrome.js"></script>
<script src="js/panels.js"></script>
<script src="js/cues.js"></script>
<script src="js/mixer.js"></script>
<script src="js/compose.js"></script>
</body>
</html>
