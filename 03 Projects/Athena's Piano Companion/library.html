<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Take Library</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📚%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/companion.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body class="listPage">
<header class="bar">
  <a class="btn icon" href="index.html" aria-label="Home" title="Home">🏠</a>
  <h1>📚 Library</h1>
  <button class="pill" id="pill" type="button">💾 this device</button>
</header>
<main class="wrap">
  <section class="panel" data-panel="filters">
    <button class="panelHead" type="button" aria-expanded="true"><span>🔎</span><span class="panelTitle">Find</span><span class="panelMark">▾</span></button>
    <div class="panelBody">
      <div class="filters">
        <input type="search" id="q" placeholder="Search name, album or description">
        <select id="fPlayer"><option value="">Everyone</option></select>
        <select id="fRating"><option value="0">Any rating</option><option value="1">★ 1 +</option><option value="2">★ 2 +</option><option value="3">★ 3 +</option><option value="4">★ 4 +</option><option value="5">★ 5</option></select>
        <select id="fSource"><option value="">All sources</option><option value="recorder">Recorded</option><option value="composer">Composed</option></select>
      </div>
      <p class="hint" id="count"></p>
      <p class="hint">Looking for the best takes, or the recycle bin? Open <a href="browse.html">🗂️ Browse</a>.</p>
    </div>
  </section>
  <div id="list" class="takeList"></div>
</main>
<script src="js/app.js"></script>
<script src="js/family.js"></script>
<script src="js/store.js"></script>
<script src="js/notes.js"></script>
<script src="js/chrome.js"></script>
<script src="js/panels.js"></script>
<script src="js/bin.js"></script>
<script src="js/library.js"></script>
</body>
</html>
