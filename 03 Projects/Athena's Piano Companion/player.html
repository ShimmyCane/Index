<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Listen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎧%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/companion.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body class="playPage">
<header class="bar">
  <a class="btn icon" href="index.html" aria-label="Record">🎹</a>
  <h1>🎧 Listen</h1>
  <button class="pill" id="pill" type="button">💾 this device</button>
</header>
<main class="wrap two">
  <div class="left">
    <section class="panel" data-panel="albums"><button class="panelHead" type="button" aria-expanded="true"><span>💿</span><span class="panelTitle">Albums</span><span class="panelMark">▾</span></button><div class="panelBody" id="albums"></div></section>
    <section class="panel" data-panel="artists"><button class="panelHead" type="button" aria-expanded="true"><span>🧑‍🎤</span><span class="panelTitle">Artists</span><span class="panelMark">▾</span></button><div class="panelBody" id="artists"></div></section>
    <section class="panel" data-panel="ratings" data-open="false"><button class="panelHead" type="button" aria-expanded="true"><span>⭐</span><span class="panelTitle">Ratings</span><span class="panelMark">▾</span></button><div class="panelBody" id="ratings"></div></section>
    <section class="panel" data-panel="lists"><button class="panelHead" type="button" aria-expanded="true"><span>🎶</span><span class="panelTitle">Playlists</span><span class="panelMark">▾</span></button><div class="panelBody"><div id="lists"></div><button class="btn wide" id="newList" type="button">＋ New playlist</button></div></section>
  </div>
  <div class="right">
    <section class="panel" data-panel="tracks"><button class="panelHead" type="button" aria-expanded="true"><span>🎵</span><span class="panelTitle" id="tracksTitle">All takes</span><span class="panelMark">▾</span></button><div class="panelBody"><div id="listTools" class="listTools" hidden></div><ol id="tracks" class="tracks"></ol></div></section>
  </div>
</main>
<footer class="now" id="now">
  <div class="nowTop">
    <div class="nowText"><strong id="nowTitle">Nothing playing</strong><span id="nowSub">Pick an album, an artist or a playlist</span></div>
    <span class="stars" id="nowStars"></span>
  </div>
  <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position">
  <div class="nowBtns">
    <button class="btn icon" id="shuffle" type="button" aria-label="Shuffle" aria-pressed="false">🔀</button>
    <button class="btn icon" id="prev" type="button" aria-label="Previous">⏮</button>
    <button class="btn icon big" id="pp" type="button" aria-label="Play">▶</button>
    <button class="btn icon" id="next" type="button" aria-label="Next">⏭</button>
    <button class="btn icon" id="repeat" type="button" aria-label="Repeat" aria-pressed="false">🔁</button>
    <select id="addTo" aria-label="Add to playlist"><option value="">＋ Playlist</option></select>
    <span id="time" class="time">0:00</span>
  </div>
</footer>
<script src="js/app.js"></script>
<script src="js/family.js"></script>
<script src="js/store.js"></script>
<script src="js/notes.js"></script>
<script src="js/chrome.js"></script>
<script src="js/panels.js"></script>
<script src="js/player.js"></script>
</body>
</html>
