<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Browse</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🗂️%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/companion.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body class="listPage browsePage">
<header class="bar">
  <a class="btn icon" href="index.html" aria-label="Home" title="Home">🏠</a>
  <h1>🗂️ Browse</h1>
  <button class="pill" id="pill" type="button">💾 this device</button>
</header>
<main class="wrap">
  <section class="panel" data-panel="bfilters">
    <button class="panelHead" type="button" aria-expanded="true"><span>🔎</span><span class="panelTitle">Find the good ones</span><span class="panelMark">▾</span></button>
    <div class="panelBody">
      <div class="filters">
        <input type="search" id="q" placeholder="Search name, album or description">
        <select id="fPlayer"><option value="">Everyone</option></select>
        <select id="fSort"><option value="stars">Best first</option><option value="days">By day</option><option value="new">Newest first</option></select>
      </div>
      <div class="starFilter" id="starFilter" role="group" aria-label="Show only takes with at least this many stars"></div>
      <p class="hint" id="count"></p>
    </div>
  </section>
  <div class="selbar" id="selbar">
    <button class="btn small" id="selAll" type="button">Select all shown</button>
    <button class="btn small" id="selNone" type="button">Select none</button>
    <button class="btn small danger" id="delSel" type="button">🗑 Delete selected (0)</button>
  </div>
  <div id="list" class="takeList"></div>
  <section class="panel" data-panel="bin" data-open="false">
    <button class="panelHead" type="button" aria-expanded="false"><span>♻️</span><span class="panelTitle" id="binTitle">Recycle bin</span><span class="panelMark">▾</span></button>
    <div class="panelBody"><p class="hint">Deleted takes stay here for 30 days. After that they are removed for good.</p><div id="bin" class="takeList"></div></div>
  </section>
</main>
<script src="js/app.js"></script>
<script src="js/family.js"></script>
<script src="js/store.js"></script>
<script src="js/notes.js"></script>
<script src="js/chrome.js"></script>
<script src="js/panels.js"></script>
<script src="js/bin.js"></script>
<script src="js/browse.js"></script>
</body>
</html>
