<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Felix Maze Drive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
  #sheet { touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; }
  .fmz-trail path { transition: stroke .5s ease; }
  .fmz-explored { transition: opacity .8s ease; }
  .result { max-width: 900px; margin: 14px auto 0; text-align: center; }
  .result .big { font: 34px var(--hand); }
  .pad { display: none; gap: 8px; justify-content: center; margin: 12px 0 0; }
  @media (pointer: coarse) { .pad { display: flex; } }
</style>
</head>
<body>
<header class="top">
  <h1 class="title"><a href="index.html">Felix Maze</a> <small id="sub">Drive it</small></h1>
  <div class="row noprint">
    <a class="btn" id="prev">◀</a>
    <a class="btn" id="next">▶</a>
    <button class="btn" id="hint">💡 Hint</button>
    <button class="btn" id="back">↩ Back</button>
    <button class="btn" id="again">⟲ Start over</button>
    <button class="btn" id="flag">🚩 Flag</button>
    <a class="btn" id="sheetLink">📄 Sheet</a>
  </div>
</header>
<main class="wrap">
  <section class="paper noprint" id="flagBox" hidden style="max-width:900px;margin:0 auto 14px">
    <h2 class="step" style="margin-top:6px">🚩 This maze doesn't work for me</h2>
    <div class="row" id="reasons"></div>
    <textarea class="field" id="flagNote" rows="2" placeholder="What's wrong? (optional, but it helps the fix)" style="width:100%;margin:10px 0"></textarea>
    <div class="row"><button class="btn go" id="flagSave" type="button">🚩 Save flag</button><button class="btn" id="flagCancel" type="button">Cancel</button></div>
  </section>
  <p class="note noprint" id="flagged" hidden style="max-width:900px;margin:0 auto 14px"></p>
  <p class="note" id="status" style="text-align:center">Drag along the path from the start to the finish. Arrow keys work too. Dead ends are fine: turn around.</p>
  <div class="paper print-sheet fit" id="sheet"></div>
  <div class="pad noprint" id="pad">
    <button class="btn" data-k="left">◀</button><button class="btn" data-k="up">▲</button><button class="btn" data-k="down">▼</button><button class="btn" data-k="right">▶</button>
  </div>
  <section class="paper result noprint" id="result" hidden>
    <div class="big">🎉 You found the way!</div>
    <p id="resultText"></p>
    <div class="row" style="justify-content:center">
      <button class="btn mint" id="replay">▶ Watch your drive</button>
      <a class="btn" id="shortWay">🎬 See the short way</a>
      <a class="btn go" id="nextMaze">Next maze ▶</a>
    </div>
  </section>
  <p class="note noprint" id="missing" hidden>No maze with that number. <a href="library.html">Open the library</a>.</p>
</main>
<script src="js/engine.js"></script>
<script src="js/art.js"></script>
<script src="js/sheet.js"></script>
<script src="js/doodle.js"></script>
<script src="js/score.js"></script>
<script src="js/shapes.js"></script>
<script src="js/designs.js"></script>
<script src="data/catalog.js"></script>
<script src="data/scores.js"></script>
<script src="data/rework.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/play.js"></script>
<script>
  (function () {
    const app = FMZ.app, S = FMZ.sheet, $ = id => document.getElementById(id);
    app.init(`<h3>Drive it</h3><p><small>Drag a finger (or the mouse) along the path. The line is one color; it turns green when you reach the finish. Turning around in a dead end is part of the fun, and the way you take does not have to be short.</small></p><div id="drives"></div>`);
    const all = app.bank();
    const rc = app.find(app.param("code") || "") || all[0];
    if (!rc) { $("missing").hidden = false; return; }
    document.title = "Felix Maze #" + rc.code + " · Drive";
    $("sub").textContent = "Drive #" + rc.code + " · " + rc.title;
    const i = all.indexOf(rc);
    $("prev").href = "play.html?code=" + encodeURIComponent(all[(i - 1 + all.length) % all.length].code);
    const nextRc = all[(i + 1) % all.length];
    $("next").href = $("nextMaze").href = "play.html?code=" + encodeURIComponent(nextRc.code);
    $("sheetLink").href = app.sheetUrl(rc);
    $("shortWay").href = "answer.html?code=" + encodeURIComponent(rc.code);
    app.mountFlag(rc);

    const out = S.svg(rc);
    $("sheet").innerHTML = out.svg;
    const model = out.model, svg = document.querySelector("#sheet svg"), NS = "http://www.w3.org/2000/svg";
    const driver = new FMZ.play.Driver(model);
    const mazeG = svg.querySelector(".fmz-maze"), host = mazeG ? mazeG.parentNode : svg;
    const mk = (cls, parent, before) => { const g = document.createElementNS(NS, "g"); g.setAttribute("class", cls); parent.insertBefore(g, before || null); return g; };
    const anchor = mazeG ? mazeG.nextSibling : svg.querySelector(".fmz-start");
    const explored = mk("fmz-explored", host, anchor), trailG = mk("fmz-trail", host, anchor), hintG = mk("fmz-hint", host, anchor);
    explored.style.opacity = 0;
    const size = model.g.s || model.spec.size || 40, W = Math.max(7, size * 0.2);
    const BLUE = "#3d8bfd", GREEN = "#2fb96b";
    const mkPath = (g, color, w) => { const p = document.createElementNS(NS, "path"); p.setAttribute("fill", "none"); p.setAttribute("stroke", color); p.setAttribute("stroke-width", w); p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round"); g.append(p); return p; };
    const trail = mkPath(trailG, BLUE, W);
    const hintPath = mkPath(hintG, "#f2a900", W * 0.7); hintPath.setAttribute("stroke-dasharray", `1 ${W * 1.6}`);
    const walker = svg.querySelector(".fmz-start > g");
    const baseT = walker ? walker.getAttribute("transform") : "";
    const scale = baseT ? (baseT.match(/scale\(([^)]+)\)/) || [])[1] : 1;
    const put = (x, y) => walker && walker.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${scale})`);
    const dstr = pts => pts.length ? "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L") : "";
    let replaying = false, timer = 0, hintTimer = 0;

    function draw() {
      trail.setAttribute("d", dstr(driver.points()));
      trail.setAttribute("stroke", driver.won ? GREEN : BLUE);
      if (driver.walk.length > 1) { const p = driver.pos(driver.cur); put(p[0], p[1]); }
      else if (walker) walker.setAttribute("transform", baseT);
      if (driver.won) won();
    }
    let wonShown = false;
    function won() {
      if (wonShown) return; wonShown = true;
      const st = driver.stats();
      $("status").textContent = "🎉 Connected!";
      // the places you looked, as soft mint dots, then the whole drive replayed
      const r = size * 0.3;
      new Set(driver.walk).forEach(c => { const p = driver.pos(c), el = document.createElementNS(NS, "circle"); el.setAttribute("cx", p[0].toFixed(1)); el.setAttribute("cy", p[1].toFixed(1)); el.setAttribute("r", r.toFixed(1)); el.setAttribute("fill", "#9be3c4"); explored.append(el); });
      setTimeout(() => { explored.style.opacity = 0.55; }, 500);
      const mins = Math.floor(st.seconds / 60), secs = st.seconds % 60;
      $("resultText").innerHTML = `You looked around <b>${st.explored}%</b> of the maze, ${st.sideSquares ? "tried <b>" + st.sideSquares + "</b> squares off the way, " : ""}turned around <b>${st.turns}</b> time${st.turns === 1 ? "" : "s"}, and took <b>${st.steps}</b> steps${st.seconds ? " in " + (mins ? mins + " min " : "") + secs + " s" : ""}${st.hints ? ", with " + st.hints + " hint" + (st.hints === 1 ? "" : "s") : ""}.<br><small>The shortest way is ${st.shortest} steps, but yours counts too.</small>`;
      $("result").hidden = false;
      const list = app.store.get("fmz.drives", []); list.push({ code: rc.code, steps: st.steps, shortest: st.shortest, seconds: st.seconds, at: new Date().toISOString() });
      app.store.set("fmz.drives", list.slice(-200));
      setTimeout(replay, 1700);
    }

    // watch the whole drive again, turn-arounds included
    function replay() {
      if (!driver.won || replaying) return;
      replaying = true; cancelAnimationFrame(timer);
      explored.style.opacity = 0.55;
      const pts = driver.points(), rp = mkPath(trailG, BLUE, W);
      rp.setAttribute("d", dstr(pts)); trail.style.opacity = 0;
      const L = rp.getTotalLength(); rp.style.strokeDasharray = L + " " + L; rp.style.strokeDashoffset = L;
      const ms = Math.min(14000, Math.max(3000, driver.walk.length * 45)), t0 = performance.now();
      const step = now => {
        const t = Math.min(1, (now - t0) / ms), p = rp.getPointAtLength(L * t);
        rp.style.strokeDashoffset = L * (1 - t); put(p.x, p.y);
        if (t < 1) timer = requestAnimationFrame(step);
        else { rp.setAttribute("stroke", GREEN); trail.style.opacity = 1; setTimeout(() => { rp.remove(); replaying = false; }, 600); }
      };
      timer = requestAnimationFrame(step);
    }
    $("replay").addEventListener("click", replay);

    function act(fn) { if (replaying) return; if (fn()) draw(); }
    // pointer: follow the passages toward the finger, a few squares at a time
    let down = false;
    const sheet = $("sheet");
    const toMaze = e => { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(trailG.getScreenCTM().inverse()); };
    const drive = e => {
      if (!down || replaying || driver.won) return;
      const p = toMaze(e), here = driver.pos(driver.cur);
      if (Math.hypot(p.x - here[0], p.y - here[1]) > size * 4) return;      // the finger is far away: wait for it
      if (driver.driveTo(driver.nearest(p.x, p.y), 6)) draw();
    };
    sheet.addEventListener("pointerdown", e => { down = true; try { sheet.setPointerCapture(e.pointerId); } catch (x) { /* ok */ } drive(e); });
    sheet.addEventListener("pointermove", drive);
    ["pointerup", "pointercancel"].forEach(t => sheet.addEventListener(t, () => { down = false; }));
    const KEYS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], a: [-1, 0], d: [1, 0], w: [0, -1], s: [0, 1] };
    document.addEventListener("keydown", e => {
      if (/input|textarea/i.test(e.target.tagName)) return;
      if (KEYS[e.key]) { e.preventDefault(); act(() => driver.go(...KEYS[e.key])); }
      else if (e.key === " ") { e.preventDefault(); hint(); }
      else if (e.key === "Backspace") { e.preventDefault(); act(() => driver.back()); }
    });
    $("pad").addEventListener("click", e => { const k = e.target.closest("[data-k]"); if (k) act(() => driver.go(...{ left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] }[k.dataset.k])); });
    $("back").addEventListener("click", () => act(() => driver.back()));

    // 💡 hint: the next few squares of the right way from where you stand, shown for a few seconds
    function hint() {
      if (replaying || driver.won) return;
      const cells = driver.hint(7); if (cells.length < 2) return;
      hintPath.setAttribute("d", dstr(cells.map(driver.pos))); hintG.style.opacity = 1;
      clearTimeout(hintTimer); hintTimer = setTimeout(() => { hintG.style.opacity = 0; }, 3500);
    }
    hintG.style.opacity = 0; hintG.style.transition = "opacity .5s";
    $("hint").addEventListener("click", hint);
    $("again").addEventListener("click", () => {
      cancelAnimationFrame(timer); replaying = false; wonShown = false; driver.reset();
      trailG.querySelectorAll("path").forEach(p => { if (p !== trail && p !== hintPath) p.remove(); });
      trail.style.opacity = 1; explored.innerHTML = ""; explored.style.opacity = 0; hintG.style.opacity = 0;
      $("result").hidden = true; $("status").textContent = "Drag along the path from the start to the finish. Arrow keys work too."; draw();
    });
    app.onDrawer = () => {
      const d = app.store.get("fmz.drives", []).filter(x => x.code === rc.code);
      $("drives").innerHTML = d.length ? "<small>You have driven this one " + d.length + " time" + (d.length === 1 ? "" : "s") + ".</small>" : "";
    };
    // for tests and tinkering
    window.FMZ_DRIVE = { driver, draw };
    draw();
  })();
</script>
</body>
</html>
